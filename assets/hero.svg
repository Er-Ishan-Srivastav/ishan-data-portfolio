<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Night Signal — data systems banner</title>
  <desc id="desc">Abstract midnight-blue city grid with crimson and electric-blue data connections.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset=".52" stop-color="#0b1d42"/><stop offset="1" stop-color="#250d24"/></linearGradient>
    <radialGradient id="redGlow"><stop offset="0" stop-color="#ff4757" stop-opacity=".4"/><stop offset="1" stop-color="#ff4757" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueGlow"><stop offset="0" stop-color="#4fa3ff" stop-opacity=".28"/><stop offset="1" stop-color="#4fa3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4fa3ff" stop-opacity=".15"/><stop offset=".5" stop-color="#dbeafe" stop-opacity=".85"/><stop offset="1" stop-color="#ff4757" stop-opacity=".2"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b8c8e8" stroke-opacity=".08" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1600" height="480" rx="22"/></clipPath>
    <style>
      .web{fill:none;stroke:url(#wire);stroke-width:1.1;stroke-dasharray:7 9;animation:flow 18s linear infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .building{fill:#070b17;stroke:#21365d;stroke-opacity:.6;stroke-width:1}
      @keyframes flow{to{stroke-dashoffset:-320}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.web,.pulse{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="480" fill="url(#sky)"/>
    <rect width="1600" height="480" fill="url(#grid)"/>
    <circle cx="1260" cy="145" r="300" fill="url(#redGlow)"/>
    <circle cx="325" cy="235" r="280" fill="url(#blueGlow)"/>
    <g fill="#d8e6ff" opacity=".7">
      <circle class="pulse" cx="165" cy="73" r="1.5"/><circle cx="360" cy="125" r="1"/><circle class="pulse" cx="510" cy="57" r="1.2"/><circle cx="703" cy="143" r="1"/><circle class="pulse" cx="1018" cy="62" r="1.4"/><circle cx="1150" cy="210" r="1"/><circle class="pulse" cx="1460" cy="87" r="1.5"/><circle cx="1382" cy="271" r="1"/><circle class="pulse" cx="810" cy="43" r="1.4"/><circle cx="925" cy="190" r="1"/>
    </g>
    <g class="web">
      <path d="M0 305L170 208 350 255 500 156 690 222 845 111 1010 183 1170 103 1360 160 1600 65"/>
      <path d="M0 380L170 208 350 344 500 156 690 335 845 111 1010 309 1170 103 1360 332 1600 65"/>
      <path d="M170 208L350 255 350 344 500 420 690 335 845 395 1010 309 1170 403 1360 332 1600 389"/>
      <path d="M350 255L690 222 1010 183 1360 160"/>
      <path d="M500 156L690 222 845 395M845 111L1010 183 1170 403"/>
      <path d="M0 305L350 344 690 222 1010 309 1360 160 1600 389"/>
    </g>
    <g fill="#4fa3ff"><circle cx="170" cy="208" r="4"/><circle cx="690" cy="222" r="4"/><circle cx="1010" cy="183" r="4"/><circle cx="1360" cy="160" r="4"/></g>
    <g fill="#ff4757"><circle cx="500" cy="156" r="4.5"/><circle cx="845" cy="111" r="4.5"/><circle cx="1170" cy="103" r="4.5"/><circle cx="350" cy="344" r="3.5"/></g>
    <g opacity=".95">
      <path class="building" d="M0 360h95v120H0zM105 332h84v148h-84zM200 385h62v95h-62zM280 344h108v136H280zM410 390h70v90h-70zM502 364h93v116h-93zM620 402h62v78h-62zM700 352h110v128H700zM832 389h65v91h-65zM920 340h112v140H920zM1053 380h70v100h-70zM1140 328h93v152h-93zM1253 366h63v114h-63zM1335 345h105v135h-105zM1457 382h143v98h-143z"/>
      <g fill="#4fa3ff" opacity=".38">
        <path d="M18 382h7v10h-7zM40 382h7v10h-7zM62 405h7v10h-7zM123 352h7v10h-7zM151 352h7v10h-7zM301 364h7v10h-7zM330 364h7v10h-7zM527 385h7v10h-7zM555 385h7v10h-7zM724 374h7v10h-7zM751 374h7v10h-7zM944 360h7v10h-7zM974 360h7v10h-7zM1163 350h7v10h-7zM1192 350h7v10h-7zM1360 367h7v10h-7zM1388 367h7v10h-7zM1484 405h7v10h-7zM1513 405h7v10h-7z"/>
