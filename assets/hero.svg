      <g fill="#ff4757" opacity=".38"><path d="M20 425h7v10h-7zM130 419h7v10h-7zM310 400h7v10h-7zM540 423h7v10h-7zM730 404h7v10h-7zM950 396h7v10h-7zM1170 390h7v10h-7zM1370 402h7v10h-7zM1500 438h7v10h-7z"/></g>
    </g>
    <path d="M0 479H1600" stroke="#4fa3ff" stroke-opacity=".4"/>
  </g>
</svg>
